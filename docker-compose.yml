version: '3.8'

services:
  # Hot-reload Dev: Vite + API (Browser nur :5173, /api wird geproxyt)
  dev:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:all:docker
    environment:
      - VITE_API_PROXY=http://127.0.0.1:3001
      - API_PORT=3001
      - DATA_DIR=/app/api/data
    env_file:
      - .env

  # Produktion: ein Container, ein Port (Static + API)
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - STATIC_DIR=/app/dist
      - API_PORT=8080
    volumes:
      - ./api/data:/app/data
