services:
  # Hot-reload Dev: Vite + API (Browser nur :5173, /api wird geproxyt)
  dev:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:all:docker
    environment:
      - VITE_API_PROXY=http://127.0.0.1:3001
      - API_PORT=3001
      - DATA_DIR=/app/api/data
    env_file:
      - .env

  # Produktion: ein Container, ein Port (Static + API)
  app:
    build:
      context: .
    # Nach Reboot / Absturz automatisch wieder hoch (nur nicht nach explizitem `docker compose stop`)
    restart: unless-stopped
    # tini als PID 1: SIGTERM wird an Node weitergereicht, Stop dauert nicht 10 s bis zum SIGKILL
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - STATIC_DIR=/app/dist
      - API_PORT=8080
    volumes:
      - ./api/data:/app/data
